services:
  postgres:
    image: postgres:15-alpine
    container_name: darkweb_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: darkweb_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: darkweb_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: